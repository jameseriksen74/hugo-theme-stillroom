{{ $pag := . }}
{{ if gt $pag.TotalPages 1 }}
<nav class="pagination" aria-label="Pagination">
  {{ with $pag.Prev }}<a href="{{ .URL }}">&larr; Newer posts</a>{{ else }}<span></span>{{ end }}
  <span>Page {{ $pag.PageNumber }} of {{ $pag.TotalPages }}</span>
  {{ with $pag.Next }}<a href="{{ .URL }}">Older posts &rarr;</a>{{ else }}<span></span>{{ end }}
</nav>
{{ end }}
